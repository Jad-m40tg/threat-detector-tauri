<!DOCTYPE html>
<html lang="en" data-page="history">
<head>
  <meta charset="utf-8">
<script src="js/core/theme-init.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Threat Detector dashboard - heuristic threat analysis.">
  <title>Threat Detector — Scan History</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2.5 20 5.3v5.2c0 4.8-3.2 8.7-8 10-4.8-1.3-8-5.2-8-10V5.3Z' fill='%238DEB6B'/%3E%3Crect x='9.4' y='10.6' width='5.2' height='4.4' rx='1' fill='none' stroke='%23101418' stroke-width='1.6'/%3E%3Cpath d='M10.6 10.6V9.6a1.4 1.4 0 0 1 2.8 0v1' fill='none' stroke='%23101418' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/base/motion-tokens.css">
<link rel="stylesheet" href="css/components/motion-governor.css">
<link rel="stylesheet" href="css/core.css">
<link rel="stylesheet" href="css/pages/history.css">
<script src="js/settings.js"></script>
<link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="css/risk-glow.css">
<link rel="stylesheet" href="css/analysis-card.css">
<script src="js/features/theme-fx.js"></script>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/theme-transition.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <main id="main-content" tabindex="-1">
    <div class="history-page-head">
      <h1 class="history-h1">Scan History</h1>
      <p class="history-subtitle">All past scans. Dashboard scans are merged here automatically.</p>
    </div>

    <!-- Summary tiles: counts always from the UNFILTERED full list -->
    <div id="history-tiles" class="tiles-row" aria-label="History summary">
      <div class="tile"><span class="tile-num" id="t-total">0</span><span class="tile-label">Total scans</span></div>
      <div class="tile tile-high"><span class="tile-num" id="t-high">0</span><span class="tile-label">High risk</span></div>
      <div class="tile tile-medium"><span class="tile-num" id="t-medium">0</span><span class="tile-label">Medium risk</span></div>
      <div class="tile tile-low"><span class="tile-num" id="t-low">0</span><span class="tile-label">Low risk</span></div>
      <div class="tile tile-na"><span class="tile-num" id="t-na">0</span><span class="tile-label">Not Verified</span></div>
    </div>

    <!-- Toolbar + table + pagination + empty state (one card) -->
    <section class="card history-card" aria-label="Scan history">
      <div class="history-toolbar">
        <div class="toolbar-row">
          <div class="field field-search">
            <label class="field-label" for="history-search">Search</label>
            <input id="history-search" class="input" type="search" placeholder="Search input or details…" autocomplete="off" spellcheck="false">
          </div>
          <div class="field">
            <label class="field-label" for="sel-type">Type</label>
            <select id="sel-type" class="select">
              <option value="all">All types</option>
              <option value="url">URLs only</option>
              <option value="message">Messages only</option>
            </select>
          </div>
          <div class="field">
            <label class="field-label" for="sel-range">Date range</label>
            <select id="sel-range" class="select">
              <option value="all">Any time</option>
              <option value="today">Today</option>
              <option value="7d">Last 7 days</option>
              <option value="30d">Last 30 days</option>
            </select>
          </div>
          <div class="toolbar-actions">
            <button id="btn-export" class="btn btn-secondary" type="button">Export CSV</button>
            <button id="btn-clear-history" class="btn btn-danger" type="button">Clear history</button>
            <span class="reset-slot" id="reset-slot"><!-- #btn-reset-filters lives here; relocates into #empty-state when the filtered view is empty -->
              <button id="btn-reset-filters" class="btn btn-ghost" type="button" hidden>Reset filters</button>
            </span>
          </div>
        </div>
        <div id="chips-risk" class="chips-row" role="group" aria-label="Filter by risk level">
          <button type="button" class="chip" data-chip="all" aria-pressed="true">All</button>
          <button type="button" class="chip" data-chip="low" aria-pressed="false">Low</button>
          <button type="button" class="chip" data-chip="medium" aria-pressed="false">Medium</button>
          <button type="button" class="chip" data-chip="high" aria-pressed="false">High</button>
          <button type="button" class="chip" data-chip="unverified" aria-pressed="false">Not Verified</button>
        </div>
      </div>

      <div class="table-wrap" id="table-wrap">
        <table class="table" id="table-history">
          <caption class="sr-only">Analysis results — scan history rows</caption>
          <colgroup>
            <col style="width:23%"><col style="width:16%"><col style="width:10%"><col style="width:14%"><col style="width:25%"><col style="width:12%">
          </colgroup>
          <thead>
            <tr>
              <th scope="col" id="th-input" aria-sort="none"><button type="button" class="th-btn" data-key="input">Input <svg class="sort-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m8.5 14.5 3.5-4 3.5 4"/></svg></button></th>
              <th scope="col" id="th-risk" aria-sort="none"><button type="button" class="th-btn" data-key="risk">Risk Level <svg class="sort-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m8.5 14.5 3.5-4 3.5 4"/></svg></button></th>
              <th scope="col" id="th-score" aria-sort="none"><button type="button" class="th-btn" data-key="score">Score <svg class="sort-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m8.5 14.5 3.5-4 3.5 4"/></svg></button></th>
              <th scope="col" id="th-status" aria-sort="none"><button type="button" class="th-btn" data-key="status">Status <svg class="sort-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m8.5 14.5 3.5-4 3.5 4"/></svg></button></th>
              <th scope="col" id="th-details" aria-sort="none"><button type="button" class="th-btn" data-key="details">Details <svg class="sort-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m8.5 14.5 3.5-4 3.5 4"/></svg></button></th>
              <th scope="col" id="th-time" aria-sort="descending"><button type="button" class="th-btn is-sorted is-desc" data-key="time">Time <svg class="sort-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m8.5 14.5 3.5-4 3.5 4"/></svg></button></th>
            </tr>
          </thead>
          <tbody id="table-history-body"></tbody>
        </table>
      </div>

      <div id="pagination" class="pagination-row">
        <div class="field-inline">
          <label class="field-label" for="row-perpage">Rows per page</label>
          <select id="row-perpage" class="select">
            <option value="10" selected>10</option>
            <option value="25">25</option>
            <option value="50">50</option>
          </select>
        </div>
        <div class="pager">
          <button id="btn-prev" class="btn btn-ghost" type="button">Prev</button>
          <span id="page-numbers" class="page-numbers"></span>
          <button id="btn-next" class="btn btn-ghost" type="button">Next</button>
        </div>
        <p id="results-meta" class="results-meta" aria-live="polite"></p>
      </div>

      <div id="empty-state" role="status" hidden>
        <div class="empty-art" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M12 2.2 20 5.1v5.4c0 4.7-3.2 8.5-8 9.8-4.8-1.3-8-5.1-8-9.8V5.1Z"/></svg>
        </div>
        <p id="empty-message" class="empty-message">No results match your filters.</p>
        <div class="empty-actions" id="empty-actions">
          <button id="btn-restore" class="btn btn-primary" type="button">Restore demo data</button>
        </div>
      </div>
    </section>
  </main>
<script src="js/core/core.js"></script>
<script src="js/core/td-config.js"></script>
<script src="js/core/events.js"></script>
<script src="js/services/bridge.js"></script>
<script src="js/services/analysisService.js"></script>
<script src="js/features/motion-governor.js"></script>
<script src="js/pages/history.js"></script>
</body>
</html>
