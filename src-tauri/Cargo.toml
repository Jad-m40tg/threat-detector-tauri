[package]
name = "threat-detector"
version = "0.1.0"
description = "Threat Detector Desktop App"
authors = ["Jad", "Antigravity"]
edition = "2021"

[lib]
name = "threat_detector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tokio-util = "0.7"
threat-core = { path = "../crates/threat-core" }
rfd = "0.15"
